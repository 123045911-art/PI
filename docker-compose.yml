services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:15
    container_name: PostgreSqlVisioflow
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visio_password_123456}
      POSTGRES_DB: ${POSTGRES_DB:-visioflow}
    # SEGURIDAD: Puerto de DB NO expuesto al host — solo accesible dentro de la red Docker.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visio_user} -d ${POSTGRES_DB:-visioflow}"]
      interval: 5s
      retries: 5
      timeout: 5s
    networks:
      - visioflow-net

  # --- SERVIDOR FASTAPI ---
  api:
    build: ./API
    container_name: FastAPIVisioflow
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-visio_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-visio_password_123456}
      DB_NAME: ${POSTGRES_DB:-visioflow}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-e83a73df016ba34185bc029707e4d8fb4be0cda803bb4c5409a63be3d4d420a8}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5000,http://localhost:19006}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - visioflow-net

  # --- SERVICIO FLASK ---
  flask_service:
    build: ./contador_personas_flask
    container_name: FlaskVisioflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      VISIOFLOW_API_BASE_URL: http://api:8000
      API_BASE_URL: http://api:8000
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-b912389d7fa02353a23a8e9d22ff0678d91c13bc20d77be60c85c39178f0d8a5}
      API_SERVICE_USERNAME: ${API_SERVICE_USERNAME:-admin}
      API_SERVICE_PASSWORD: ${API_SERVICE_PASSWORD:-123456}
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      CAMERA_SOURCE: "${CAMERA_SOURCE:-0}"
    devices:
      - "${CAMERA_DEVICE:-/dev/null}:/dev/video0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - visioflow-net
    volumes:
      - ./contador_personas_flask/app:/app/app

volumes:
  postgres_data:

networks:
  visioflow-net:
    driver: bridge