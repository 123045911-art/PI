services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:15
    container_name: PostgreSqlVisioflow
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # SEGURIDAD: Puerto de DB NO expuesto al host — solo accesible dentro de la red Docker.
    # Si necesitas acceso externo temporal para desarrollo, descomenta la línea siguiente:
    # ports:
    #   - "127.0.0.1:5435:5432"   # Solo loopback, nunca 0.0.0.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5
      timeout: 5s
    networks:
      - visioflow-net

  # --- SERVIDOR FASTAPI ---
  api:
    build: ./API
    container_name: FastAPIVisioflow
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8085,http://localhost:5000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - visioflow-net

  # --- SERVICIO FLASK ---
  flask_service:
    build: ./contador_personas_flask
    container_name: FlaskVisioflow
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      VISIOFLOW_API_BASE_URL: http://api:8000
      API_BASE_URL: http://api:8000
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5000"
      FLASK_DEBUG: "0"
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      API_SERVICE_USERNAME: ${API_SERVICE_USERNAME:-}
      API_SERVICE_PASSWORD: ${API_SERVICE_PASSWORD:-}
      PYTHONUNBUFFERED: "1"
      CAMERA_SOURCE: "${CAMERA_SOURCE:-0}"
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    networks:
      - visioflow-net

  # --- SERVICIO LARAVEL DASHBOARD ---
  laravel:
    build: ./contador_dashboard
    container_name: LaravelVisioflow
    ports:
      - "8085:8000"
    volumes:
      - ./contador_dashboard:/var/www/html
      - /var/www/html/vendor
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - INTERNAL_API_URL=http://api:8000
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=null
      - DATABASE_URL=null
      - SESSION_DRIVER=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - OCTANE_SERVER=swoole
    networks:
      - visioflow-net

  # --- REDIS PARA CACHÉ Y SESIONES ---
  redis:
    image: redis:alpine
    container_name: RedisVisioflow
    # SEGURIDAD: Redis protegido con contraseña y puerto NO expuesto al host.
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0
    # ports:                    # Puerto Redis NO expuesto al host en producción.
    #   - "127.0.0.1:6379:6379" # Descomenta solo para debug local.
    networks:
      - visioflow-net

volumes:
  postgres_data:

networks:
  visioflow-net:
    driver: bridge