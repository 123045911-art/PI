# Variante de haproxy.cfg SOLO para pruebas locales en un mismo Docker Desktop
# (Windows/Mac), antes de desplegar en AWS. Unica diferencia: los backends
# apuntan a "host.docker.internal" en vez de <PRIVATE_SERVER_IP>, porque
# compose.private.yaml ya publica sus puertos (8001-8003, 5001) al host, y
# desde otro contenedor (haproxy) host.docker.internal resuelve a esa misma
# maquina. No se usa en produccion — ver compose.public.local.yaml.

global
    log stdout format raw local0
    maxconn 4096

    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    http-request redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/server.pem

    acl path_grafana path_beg /grafana

    use_backend grafana_back if path_grafana
    default_backend flask_back

frontend api_front
    bind *:8080 ssl crt /usr/local/etc/haproxy/certs/server.pem
    default_backend api_back

backend api_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server api1 host.docker.internal:8001 check
    server api2 host.docker.internal:8002 check
    server api3 host.docker.internal:8003 check

backend flask_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server flask1 host.docker.internal:5001 check

backend grafana_back
    server grafana grafana:3000 check

listen stats
    bind *:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

frontend prometheus_front
    bind *:8405
    mode http

    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
