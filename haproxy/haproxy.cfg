# HAProxy - servidor publico. Termina TLS y reparte trafico hacia el
# servidor privado (otra instancia AWS: 172.31.17.57).
#
# Certificado: letsencrypt-server.pem es un certificado REAL de Let's Encrypt
# para el hostname 18-223-97-60.sslip.io (DNS publico gratuito que resuelve a
# la IP publica de esta instancia). Se renueva solo via certbot.timer +
# /etc/letsencrypt/renewal-hooks/deploy/haproxy-reload.sh en el servidor.
# server.pem (autofirmado) se conserva en el repo solo como referencia/backup.
#
# Nota de diseno: a diferencia de otros proyectos similares, aqui NO se usa
# un ACL de path "/api" que reescriba la ruta hacia el backend de la API,
# porque el Flask de VisioFlow ya expone sus propias paginas web en /users
# (gestion de usuarios del dashboard) que colisionarian con el router /users
# de FastAPI. Por eso la API vive en su propio frontend dedicado (:8080).

global
    log stdout format raw local0
    maxconn 4096

    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log global
    mode http
    option httplog
    option forwardfor

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    http-request redirect scheme https code 301

# Dashboard web de Flask (sitio principal) + Grafana bajo /grafana.
frontend https_front
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/letsencrypt-server.pem

    acl path_grafana path_beg /grafana

    use_backend grafana_back if path_grafana
    default_backend flask_back

# Frontend dedicado para la API (mobile app / clientes JSON). TLS tambien,
# porque aqui viajan tokens JWT reales.
frontend api_front
    bind *:8080 ssl crt /usr/local/etc/haproxy/certs/letsencrypt-server.pem
    default_backend api_back

backend api_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server api1 172.31.17.57:8001 check
    server api2 172.31.17.57:8002 check
    server api3 172.31.17.57:8003 check

backend flask_back
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server flask1 172.31.17.57:5001 check

backend grafana_back
    server grafana grafana:3000 check

listen stats
    bind *:8404
    mode http

    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

frontend prometheus_front
    bind *:8405
    mode http

    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404
