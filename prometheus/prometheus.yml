# Prometheus corre en el servidor privado (compose.private.yaml). Aqui viven
# los scrape targets del propio servidor privado, mas el job "haproxy-edge"
# que cruza al servidor publico (otra instancia AWS).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node
    static_configs:
      - targets:
          - node_exporter:9100

  - job_name: redis
    static_configs:
      - targets:
          - redis_exporter:9121

  - job_name: postgres
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: haproxy-edge
    metrics_path: /metrics
    static_configs:
      - targets:
          - 18.223.97.60:8405
